<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.github.com; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>다정다감컴퍼니 사옥</title>
<meta name="description" content="다정다감컴퍼니 사옥 — 게임 삼한제일을 만드는 곳">
<style>
  /* 사옥 2단계. 이 파일에는 업무 글이 없다. 업무 자료는 office.load(state)로만 들어온다(보안 02).
     그림체 07: 밝고 따뜻한 색, 검은 테두리 없음. */
  :root{
    --paper:#f7efe0; --paper2:#efe2c9; --ink:#4a3426; --ink2:#7a5c45;
    --wall:#9a6a48; --wood:#e9bd78; --wood2:#dcab63; --stone:#d8cbb4; --stone2:#cbbda4;
    --carpet:#c8553d; --carpet2:#b9493a; --leaf:#6f9a4e; --leaf2:#88b162;
    --desk:#b97f4c; --desk2:#a66f40; --screen:#6b8794; --hanji:#fbf5e8; --gold:#e8a93a;
    --alarm:#e2332a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Pretendard","Pretendard Variable",-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    background:radial-gradient(ellipse at 20% 0%,#fff8ea 0%,var(--paper) 55%,var(--paper2) 100%);
    color:var(--ink); -webkit-tap-highlight-color:transparent;
  }
  button{font:inherit;color:inherit}
  header{display:flex;align-items:center;gap:.6em;flex-wrap:wrap;padding:10px 16px 6px}
  header h1{margin:0;font-size:clamp(18px,2.4vw,24px);font-weight:800;letter-spacing:-.02em}
  header .sub{margin:0;color:var(--ink2);font-size:clamp(12px,1.5vw,14px)}
  header .right{margin-left:auto;display:flex;align-items:center;gap:8px}
  #updated{color:var(--ink2);font-size:13px;font-weight:600}
  .pill{border:0;border-radius:999px;background:var(--hanji);padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;
    box-shadow:0 2px 0 rgba(150,105,65,.35)}
  .pill[aria-pressed="false"]{background:#ead9bd;color:var(--ink2)}
  .pill:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  main{padding:4px 16px 14px}

  /* ── 평면도 ── */
  .plan{
    position:relative; width:100%;
    display:grid; gap:0;
    grid-template-columns:1fr 1fr 1fr 1fr 1fr 1fr 1.5fr;
    grid-template-rows:1fr .42fr 1fr;
    grid-template-areas:
      "ceo ceo pd plan item art rest"
      "hall hall hall hall hall hall rest"
      "dev dev qa sec acct pr rest";
    aspect-ratio:7.5/3.25; max-height:calc(100vh - 70px); max-height:calc(100dvh - 70px);
    background:var(--wall); padding:10px; border-radius:18px;
    box-shadow:0 10px 24px rgba(122,84,52,.22), inset 0 0 0 3px #a8774f;
  }
  .room{
    position:relative; overflow:hidden; border-radius:4px;
    background:
      repeating-linear-gradient(90deg,transparent 0 22px,rgba(160,110,60,.13) 22px 23px),
      linear-gradient(160deg,var(--wood) 0%,var(--wood2) 100%);
    box-shadow:inset 0 0 0 5px var(--wall), inset 0 0 18px 6px rgba(140,90,50,.18);
  }
  .room.tile{background:
      repeating-linear-gradient(0deg,transparent 0 26px,rgba(120,100,80,.12) 26px 27px),
      repeating-linear-gradient(90deg,transparent 0 26px,rgba(120,100,80,.12) 26px 27px),
      linear-gradient(160deg,#efe4cf,#e2d3b8)}
  .room.mat{background:
      repeating-linear-gradient(90deg,transparent 0 30px,rgba(120,130,60,.14) 30px 32px),
      linear-gradient(160deg,#e4d79a,#d4c47f)}
  .room.lounge{background:
      repeating-linear-gradient(45deg,transparent 0 18px,rgba(160,120,70,.10) 18px 19px),
      linear-gradient(160deg,#f1d9a8,#e6c58a)}

  .door{position:absolute;background:var(--stone);z-index:2}
  .A .door{bottom:0;left:38%;width:24%;height:6px}
  .B .door{top:0;left:38%;width:24%;height:6px}
  .R .door{left:0;top:42%;width:6px;height:16%}

  .tag{position:absolute;left:8px;top:8px;z-index:6;background:var(--hanji);border-radius:7px;
    padding:3px 7px;font-size:clamp(10px,1.2vw,14px);font-weight:700;white-space:nowrap;box-shadow:0 2px 0 rgba(150,105,65,.35)}
  .tag i{display:inline-block;width:.6em;height:.6em;border-radius:50%;margin-right:.35em;vertical-align:.05em;background:var(--c)}
  .task{position:absolute;left:6px;right:6px;bottom:8px;z-index:6;background:rgba(251,245,232,.94);border-radius:6px;
    padding:2px 6px;font-size:clamp(9px,1vw,12px);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .task:empty{display:none}

  /* 가구 */
  .f{position:absolute;border-radius:6px}
  .desk{background:linear-gradient(180deg,var(--desk),var(--desk2));box-shadow:0 3px 0 rgba(110,70,40,.35)}
  .mon{background:linear-gradient(180deg,#86a2ad,var(--screen));border-radius:3px;box-shadow:0 2px 0 rgba(70,90,100,.35)}
  .plant{border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--leaf2),var(--leaf));box-shadow:0 3px 0 rgba(80,110,50,.35)}
  .jar{border-radius:50%;background:radial-gradient(circle at 35% 30%,#c98a5a,#9c6240);box-shadow:0 3px 0 rgba(110,70,40,.3)}
  .shelf{background:repeating-linear-gradient(90deg,#c58b55 0 8px,#e6c98d 8px 12px,#7e9c6a 12px 17px,#d9a04e 17px 22px);border-radius:3px;box-shadow:0 3px 0 rgba(110,70,40,.3)}
  .rug{border-radius:10px;background:radial-gradient(ellipse,#d9776033,#c8553d22);box-shadow:inset 0 0 0 3px #c8553d55}
  .round{border-radius:50%;background:radial-gradient(circle at 40% 35%,#d39a62,#b07a49);box-shadow:0 3px 0 rgba(110,70,40,.35)}
  .rack{background:repeating-linear-gradient(180deg,#8a9aa2 0 6px,#9fd28a 6px 8px,#8a9aa2 8px 14px);border-radius:4px;box-shadow:0 3px 0 rgba(70,90,100,.3)}
  .chest{background:linear-gradient(180deg,#b9733e,#9a5c31);border-radius:5px;box-shadow:inset 0 -4px 0 #e8a93a88,0 3px 0 rgba(110,70,40,.35)}
  .phone{background:#7f96a0;border-radius:4px;box-shadow:inset 0 0 0 2px #a9c0c8}
  .poster{background:linear-gradient(180deg,#e9805f,#c8553d);border-radius:3px;box-shadow:0 2px 0 rgba(120,60,40,.3)}
  .chair-big{border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9734f,#a94d33);box-shadow:0 0 0 3px var(--hanji)}
  .sofa{border-radius:14px;background:linear-gradient(180deg,#d8735a,#b9563f);box-shadow:inset 0 0 0 5px #c4614a,0 4px 0 rgba(120,60,40,.3)}
  .window{border-radius:3px;background:linear-gradient(180deg,#cfe6ef,#a9d0e0);box-shadow:0 0 18px 6px rgba(255,232,170,.55)}
  .sun{border-radius:12px;background:radial-gradient(ellipse,rgba(255,236,180,.55),rgba(255,236,180,0) 70%)}
  .cup{border-radius:50%;background:radial-gradient(circle,#8c5a3a 40%,#f4ead6 42%)}
  .kettle{border-radius:50% 50% 45% 45%;background:radial-gradient(circle at 35% 30%,#9aa67a,#6f7d55);box-shadow:0 3px 0 rgba(80,90,50,.3)}
  .onP{display:none}

  /* 경광등 (급한 일일 때만) */
  .beacon{position:absolute;right:8px;top:8px;z-index:6;width:clamp(12px,1.6vw,20px);aspect-ratio:1;border-radius:50%;display:none;
    background:radial-gradient(circle at 40% 35%,#ff9a8a,var(--alarm) 60%,#a51c16)}
  .room.alarm .beacon{display:block;animation:beacon 1s steps(2,jump-none) infinite}
  .room.alarm::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:rgba(226,51,42,.22);animation:roomflash 1s ease-in-out infinite}
  @keyframes beacon{0%{box-shadow:0 0 6px 2px rgba(255,60,40,.5);filter:brightness(.8)}100%{box-shadow:0 0 22px 10px rgba(255,60,40,.85);filter:brightness(1.3)}}
  @keyframes roomflash{0%,100%{opacity:.25}50%{opacity:1}}

  /* 복도 */
  .hall{grid-area:hall;position:relative;overflow:hidden;display:grid;place-items:center;background:
      repeating-linear-gradient(90deg,transparent 0 40px,rgba(110,95,75,.12) 40px 41px),
      linear-gradient(180deg,var(--stone),var(--stone2))}
  .runner{position:absolute;left:3%;right:0;top:32%;bottom:32%;border-radius:6px 0 0 6px;
    background:linear-gradient(90deg,var(--carpet2),var(--carpet) 10%,var(--carpet));box-shadow:inset 0 0 0 3px #e3a35a88}
  .sign{position:relative;z-index:2;background:var(--hanji);border-radius:10px;padding:4px 14px;
    font-weight:800;font-size:clamp(11px,1.4vw,16px);box-shadow:0 3px 0 rgba(150,105,65,.4);white-space:nowrap}
  .sign small{font-weight:600;color:var(--ink2);margin-left:.5em}
  .hall .plant{width:clamp(14px,2.2vw,26px);aspect-ratio:1}
  .hall .p1{left:1.5%;top:12%}

  /* ── 팀장 얼굴 (평면 위 한 겹, 걸어 다님) ── */
  .heads{position:absolute;inset:0;z-index:7;pointer-events:none}
  .head{position:absolute;left:0;top:0;width:clamp(28px,5.2vw,66px);aspect-ratio:1;padding:0;border:0;background:none;
    pointer-events:auto;cursor:pointer;transition-property:transform;transition-timing-function:linear;will-change:transform}
  .head .ring{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--c);
    box-shadow:0 0 0 3px var(--hanji),0 4px 0 3px rgba(120,80,50,.25)}
  .head img{width:100%;height:100%;object-fit:cover;display:block}
  .head:focus-visible{outline:none}
  .head:focus-visible .ring{box-shadow:0 0 0 3px var(--hanji),0 0 0 6px var(--gold)}
  .head.walking .ring{animation:bob .32s ease-in-out infinite alternate}
  @keyframes bob{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-12%) rotate(4deg)}}
  .head .hand{position:absolute;right:-38%;top:-50%;width:70%;height:auto;display:none;transform-origin:50% 100%;animation:wave .5s ease-in-out infinite alternate;
    background:var(--hanji);border-radius:50%;padding:10%;box-shadow:0 0 0 2px var(--gold),0 3px 0 2px rgba(120,80,50,.3)}
  .head.urgent .hand{box-shadow:0 0 0 2px var(--alarm),0 3px 0 2px rgba(120,80,50,.3)}
  .head.raised .hand{display:block}
  @keyframes wave{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
  .head.urgent .ring{animation:redring 1s ease-in-out infinite}
  .head.urgent.walking .ring{animation:bob .32s ease-in-out infinite alternate,redring 1s ease-in-out infinite}
  .head.acked .ring{box-shadow:0 0 0 3px var(--alarm),0 4px 0 3px rgba(120,80,50,.25)}
  @keyframes redring{0%,100%{box-shadow:0 0 0 3px var(--hanji),0 0 0 3px rgba(226,51,42,0)}50%{box-shadow:0 0 0 4px var(--alarm),0 0 18px 8px rgba(226,51,42,.7)}}

  /* 화면 가장자리 붉은 번쩍임 */
  .edge{position:fixed;inset:0;pointer-events:none;z-index:30;opacity:0;
    box-shadow:inset 0 0 0 6px var(--alarm),inset 0 0 70px 14px rgba(226,51,42,.6)}
  .edge.on{animation:edge 1s ease-in-out infinite}
  @keyframes edge{0%,100%{opacity:.15}50%{opacity:1}}

  /* ── 대화창 ── */
  .modal{position:fixed;inset:0;z-index:40;background:rgba(74,52,38,.38);display:none;place-items:center;padding:10px}
  .modal.open{display:grid}
  .chat{width:min(520px,100%);max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px);background:var(--hanji);border-radius:18px;
    display:flex;flex-direction:column;overflow:hidden;box-shadow:0 14px 34px rgba(80,50,30,.35)}
  .chat-top{display:flex;align-items:center;gap:10px;padding:12px 12px 10px 14px;background:#f3e6c8}
  .chat-top .ring{width:46px;height:46px;flex:0 0 46px;border-radius:50%;overflow:hidden;background:var(--c);box-shadow:0 0 0 3px #fff}
  .chat-top img{width:100%;height:100%;object-fit:cover}
  .chat-top h2{margin:0;font-size:17px;flex:1}
  .x{border:0;background:transparent;font-size:24px;color:var(--ink2);cursor:pointer;padding:2px 8px;border-radius:8px}
  .x:focus-visible{outline:3px solid var(--gold)}
  .urgentbar{display:none;align-items:center;gap:10px;padding:8px 14px;background:var(--alarm);color:#fff;font-weight:700;font-size:14px}
  .urgentbar.on{display:flex}
  .urgentbar span{flex:1}
  .urgentbar button{border:0;border-radius:999px;background:#fff;color:var(--alarm);font-weight:800;padding:6px 14px;cursor:pointer}
  .msgs{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-height:80px}
  .m{max-width:84%;padding:8px 11px;border-radius:12px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .m.lead{align-self:flex-start;background:#f0e2c5;border-top-left-radius:4px}
  .m.me{align-self:flex-end;background:#f6d3c2;border-top-right-radius:4px}
  .m .meta{display:block;font-size:11px;color:var(--ink2);margin-top:3px}
  .m .wait{color:#b0532f;font-weight:700}
  .empty-msg{color:var(--ink2);font-size:14px;margin:auto 0;text-align:center}
  .compose{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #ead9bd}
  .compose textarea{flex:1;resize:none;border:0;border-radius:10px;background:#fff;padding:8px 10px;font:inherit;font-size:14px;color:var(--ink);
    box-shadow:inset 0 0 0 2px #ead9bd;min-height:42px;max-height:120px}
  .compose textarea:focus{outline:none;box-shadow:inset 0 0 0 2px var(--gold)}
  .compose button{border:0;border-radius:10px;background:var(--carpet);color:#fff;font-weight:800;padding:0 16px;cursor:pointer}
  .compose button:disabled{opacity:.45;cursor:default}
  .compose button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  /* ── 들어가기 ── */
  .gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(247,239,224,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  .gate[hidden]{display:none}
  .gate-card{background:var(--hanji);border-radius:20px;padding:22px 26px;text-align:center;box-shadow:0 12px 30px rgba(122,84,52,.25)}
  .gate-card h2{margin:0 0 4px;font-size:20px}
  .gate-card p{margin:0 0 14px;color:var(--ink2);font-size:14px}
  #enter{border:0;border-radius:999px;background:var(--carpet);color:#fff;font-weight:800;font-size:16px;padding:12px 26px;cursor:pointer;
    box-shadow:0 4px 0 #9b3f2e}
  #enter:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

  footer{padding:0 16px 12px;color:var(--ink2);font-size:12px}

  /* ── 세로 화면 ── */
  @media (orientation:portrait){
    .plan{grid-template-columns:1fr .36fr 1fr;
      grid-template-rows:1.3fr 1fr 1fr 1fr 1fr 1.5fr;
      grid-template-areas:"ceo hall dev" "pd hall qa" "plan hall sec" "item hall acct" "art hall pr" "rest rest rest";
      aspect-ratio:2.36/5.8; max-height:none}
    .A .door{bottom:auto;left:auto;right:0;top:36%;width:6px;height:28%}
    .B .door{top:36%;left:0;width:6px;height:28%}
    .R .door{left:40%;top:0;width:20%;height:6px}
    .runner{left:30%;right:30%;top:2%;bottom:0;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--carpet2),var(--carpet) 8%,var(--carpet))}
    .sign{writing-mode:vertical-rl;padding:12px 4px;letter-spacing:.1em}
    .sign small{margin:.5em 0 0}
    .hall .p1{left:auto;top:1.5%}
    .head{width:clamp(30px,10vw,54px)}
    .tag{font-size:clamp(11px,3.2vw,14px)}
    .task{font-size:clamp(9px,2.8vw,12px)}
    .beacon{width:clamp(12px,4vw,18px)}
    .onL{display:none}.onP{display:block}
  }
  @media (orientation:landscape) and (max-height:480px){
    header{padding:5px 12px 2px} header .sub{display:none}
    main{padding:3px 12px 6px}
    .plan{max-height:calc(100vh - 46px);max-height:calc(100dvh - 46px);padding:7px}
    footer{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .head{transition-duration:0s!important}
    .head.walking .ring,.head .hand{animation:none}
    .edge.on{animation:none;opacity:.7}
    .room.alarm .beacon,.room.alarm::before,.head.urgent .ring{animation-duration:2s}
  }
  /* 개발 26: 비밀번호 칸·답 안내 */
  /* 1. 대표실 주인공 (걷지 않음, 의자 자리) */
  .hero{position:absolute;left:51%;top:38%;z-index:5;width:clamp(28px,5.2vw,66px);aspect-ratio:1;transform:translate(-50%,-50%);
    border-radius:50%;overflow:hidden;background:var(--carpet);box-shadow:0 0 0 3px var(--hanji),0 4px 0 3px rgba(120,80,50,.25)}
  .hero img{width:100%;height:100%;object-fit:cover;display:block}
  /* 2. 지금 하는 일 말풍선 */
  .tip{position:absolute;z-index:9;pointer-events:auto;min-width:130px;max-width:min(240px,70vw);background:var(--hanji);border-radius:12px;
    padding:8px 11px 9px;font-size:13px;line-height:1.45;box-shadow:0 6px 16px rgba(110,70,40,.28);transform:translate(-50%,calc(-100% - 10px))}
  .tip::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:var(--hanji);transform:translateX(-50%) rotate(45deg)}
  .tip[hidden]{display:none}
  .tip b{display:block;font-size:13px}
  .tip .t-task{display:block;margin-top:2px;word-break:break-word}
  .tip .t-time{display:block;margin-top:3px;font-size:11px;color:var(--ink2)}
  .tip button{margin-top:6px;border:0;border-radius:999px;background:var(--carpet);color:#fff;font-weight:700;font-size:12px;padding:4px 12px;cursor:pointer}
  .tip button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  /* 5. 답하는 중 '…' */
  .head .typing{position:absolute;left:-66%;top:24%;display:none;gap:3px;align-items:center;padding:5px 7px;border-radius:12px;background:var(--hanji);
    box-shadow:0 0 0 2px var(--gold),0 3px 0 2px rgba(120,80,50,.3)}
  .head .typing i{width:5px;height:5px;border-radius:50%;background:var(--ink2);animation:dot 1s ease-in-out infinite}
  .head .typing i:nth-child(2){animation-delay:.15s}.head .typing i:nth-child(3){animation-delay:.3s}
  .head.answering .typing{display:flex}
  @keyframes dot{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
  /* 할 일 판 (대표님 11:51) */
  .tag .tbadge{display:none;margin-left:.35em;min-width:1.35em;padding:0 .35em;border-radius:999px;background:var(--alarm);color:#fff;font-size:.82em;
    line-height:1.35em;text-align:center;font-style:normal;vertical-align:.05em}
  .tag .tbadge.on{display:inline-block}
  .todo{margin:14px auto 0;max-width:1180px;background:var(--hanji);border-radius:18px;padding:16px 18px 20px;box-shadow:0 8px 20px rgba(122,84,52,.16)}
  .todo[hidden]{display:none}
  .todo-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .todo-n{display:grid;place-items:center;min-width:64px;height:64px;padding:0 10px;border-radius:18px;background:var(--carpet);color:#fff;font-size:36px;font-weight:800;box-shadow:0 4px 0 #9b3f2e}
  .todo-n.zero{background:#9db57f;box-shadow:0 4px 0 #6f8a55}
  .todo-head h2{margin:0;font-size:22px}
  .todo-sub{margin:2px 0 0;font-size:14px;color:var(--ink2)} .todo-sub b{color:var(--alarm)}
  .dept{margin-top:16px;scroll-margin-top:12px;border-radius:14px;transition:box-shadow .3s}
  .dept.flash{box-shadow:0 0 0 4px var(--gold)}
  .dept-h{display:flex;align-items:center;gap:10px;margin:0 0 8px;font-size:17px;font-weight:800}
  .dept-h .ring{width:34px;height:34px;flex:0 0 34px;border-radius:50%;overflow:hidden;background:var(--c);box-shadow:0 0 0 2px #fff,0 2px 0 2px rgba(120,80,50,.2)}
  .dept-h .ring img{width:100%;height:100%;object-fit:cover;display:block}
  .dept-h .cnt{font-size:13px;color:var(--ink2);font-weight:700}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
  .card{position:relative;background:#fffaf0;border-radius:14px;padding:12px 14px 12px 18px;box-shadow:0 3px 0 rgba(150,105,65,.25),inset 0 0 0 1px #efdfc2;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
  .card.urgent::before{background:var(--alarm)}
  .card h3{margin:0;font-size:18px;line-height:1.35;word-break:keep-all}
  .card .chip{display:inline-block;margin-right:6px;padding:1px 8px;border-radius:999px;background:var(--alarm);color:#fff;font-size:12px;font-weight:800;vertical-align:2px}
  .card .why{margin:4px 0 0;font-size:14px;color:var(--ink2)}
  .card ol{margin:8px 0 0;padding-left:1.4em;font-size:15px;line-height:1.5}
  .card .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .card .acts a,.card .acts button.donebtn{display:inline-block;border:0;border-radius:999px;padding:8px 16px;font-size:15px;font-weight:800;text-decoration:none;cursor:pointer}
  .card .acts a{background:var(--gold);color:#3b2a1e;box-shadow:0 3px 0 #b8812a}
  .card .acts button.donebtn{background:var(--leaf);color:#fff;box-shadow:0 3px 0 #557a3a}
  .card .acts a:focus-visible,.card .acts button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .card .choices{margin-top:10px}
  .card .waitband{margin:10px -14px -12px -18px;padding:7px 14px 7px 18px;background:#e9e1d3;color:var(--ink2);font-size:14px;font-weight:700}
  .card.waiting{background:#f4efe6}
  .card.waiting h3,.card.waiting ol{color:var(--ink2)}
  .card.done{opacity:.6;background:#f1ece3;padding-top:8px;padding-bottom:8px}
  .card.done::before{background:#b9ad99}
  .card.done h3{font-size:15px;text-decoration:line-through}
  .card.done .donetag{display:block;font-size:13px;color:var(--leaf);font-weight:800;margin-top:2px}
  .sub-h{margin:12px 0 6px;font-size:13px;color:var(--ink2);font-weight:800}
  @media (orientation:portrait){ .todo{padding:14px 12px 16px} .todo-n{min-width:54px;height:54px;font-size:30px} .cards{grid-template-columns:1fr} }
  /* 4. 고르기 단추 */
  .choices{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .choice{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-radius:12px;background:#fff;padding:10px 12px;
    font-size:15px;font-weight:700;cursor:pointer;box-shadow:inset 0 0 0 2px #e3c999,0 3px 0 rgba(150,105,65,.3);white-space:normal}
  .choice .k{flex:0 0 auto;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--carpet);color:#fff;font-weight:800}
  .choice:hover:not(:disabled){box-shadow:inset 0 0 0 2px var(--gold),0 3px 0 rgba(150,105,65,.3)}
  .choice:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .choice:disabled{cursor:default}
  .choice.picked{background:#fbe6c4;box-shadow:inset 0 0 0 2px var(--gold)}
  .choice.picked .k{background:var(--gold)}
  .choice .pk{margin-left:auto;font-size:12px;color:var(--ink2);font-weight:700}
  .m .wait.fail{color:var(--alarm)}
  /* 3. 아래 대화 줄 */
  body{padding-bottom:var(--barh,0px)}
  .plan{max-height:calc(100vh - 70px - var(--barh,0px));max-height:calc(100dvh - 70px - var(--barh,0px))}
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:35;margin:0 auto;width:min(900px,100%);background:var(--hanji);
    border-radius:16px 16px 0 0;box-shadow:0 -6px 20px rgba(110,70,40,.22);padding:6px 0 max(4px,env(safe-area-inset-bottom))}
  .bar[hidden]{display:none}
  .bar-top{display:flex;align-items:center;gap:8px;padding:2px 12px 4px}
  .who{display:flex;gap:6px;overflow-x:auto;flex:1;padding:4px 2px;scrollbar-width:none}
  .whob{flex:0 0 auto;width:34px;height:34px;padding:0;border:0;border-radius:50%;overflow:hidden;cursor:pointer;background:var(--c);
    box-shadow:0 0 0 2px var(--hanji),0 2px 0 2px rgba(120,80,50,.2);opacity:.6}
  .whob img{width:100%;height:100%;object-fit:cover;display:block}
  .whob[aria-checked="true"]{opacity:1;box-shadow:0 0 0 2px var(--hanji),0 0 0 5px var(--gold)}
  .whob:focus-visible{outline:none;box-shadow:0 0 0 2px var(--hanji),0 0 0 5px var(--ink2)}
  .barlog{max-height:min(26vh,220px);min-height:0;padding:6px 14px;border-top:1px solid #ead9bd}
  .bar:not(.open) .barlog{display:none}
  .bar .compose{padding:6px 12px}
  .bar .replynote{padding:0 14px 2px}
  @media (orientation:portrait){ .hero{width:clamp(30px,10vw,54px)} }
  @media (orientation:landscape) and (max-height:480px){ .whob{width:28px;height:28px} .bar .replynote{display:none} .barlog{max-height:30vh} }
  @media (prefers-reduced-motion:reduce){ .head .typing i{animation:none;opacity:.8} }
  .gate-pw{display:block;width:min(260px,70vw);margin:4px auto 12px;font:inherit;font-size:16px;padding:10px 12px;border:1px solid #b89b74;border-radius:10px;background:#fffaf0;color:inherit}
  .gate-pw:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .gate-msg{min-height:1.3em;margin:10px 0 0;font-size:14px;color:#9b2b1a}
  #enter:disabled{opacity:.6;cursor:wait}
  .replynote{margin:0;padding:4px 14px 10px;font-size:12px;color:var(--ink2)}
</style>
</head>
<body>
<header>
  <h1>다정다감컴퍼니 사옥</h1>
  <p class="sub">게임 「삼한제일」을 만드는 곳</p>
  <div class="right">
    <span id="updated" hidden></span>
    <button class="pill" id="sound" aria-pressed="true">소리 켜짐</button>
    <button class="pill" id="leave" hidden>나가기</button>
  </div>
</header>
<main>
  <div class="plan" id="plan" role="group" aria-label="사옥 평면도"></div>
  <section class="todo" id="todo" hidden aria-labelledby="todoTitle">
    <div class="todo-head">
      <span class="todo-n" id="todoN">0</span>
      <div><h2 id="todoTitle">지금 할 일</h2><p class="todo-sub" id="todoSub"></p></div>
    </div>
    <div id="todoList"></div>
  </section>
</main>
<footer>다정다감컴퍼니 · 삼한제일</footer>

<!-- 늘 있는 대화 줄 (대표님 11:26, 개발 26) -->
<section class="bar" id="bar" hidden aria-label="팀장에게 말하기">
  <div class="bar-top">
    <div class="who" id="who" role="radiogroup" aria-label="받는 팀장"></div>
    <button class="pill" id="logBtn" type="button" aria-expanded="true" aria-controls="barlog">기록</button>
  </div>
  <div class="msgs barlog" id="barlog" aria-live="polite"></div>
  <form class="compose" id="barForm">
    <textarea id="barText" rows="1" maxlength="1000" placeholder="총괄이사에게" aria-label="대표님 말"></textarea>
    <button type="submit" id="barSend" disabled>보내기</button>
  </form>
  <p class="replynote">보내면 바로 갑니다. 5초 안에 되돌릴 수 있습니다.</p>
</section>

<div class="edge" id="edge" aria-hidden="true"></div>

<div class="modal" id="modal" aria-hidden="true">
  <div class="chat" role="dialog" aria-modal="true" aria-labelledby="chatName">
    <div class="chat-top">
      <span class="ring" id="chatFace"></span>
      <h2 id="chatName"></h2>
      <button class="x" id="chatClose" aria-label="닫기">×</button>
    </div>
    <div class="urgentbar" id="urgentbar"><span>급한 일</span><button id="ackBtn">확인</button></div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <form class="compose" id="compose">
      <textarea id="reply" rows="2" maxlength="1000" placeholder="답을 적어 주세요" aria-label="대표님 답"></textarea>
      <button type="submit" id="sendBtn" disabled>보내기</button>
    </form>
    <p class="replynote">보내면 바로 갑니다. 5초 안에 되돌릴 수 있습니다. 글 끝에 "— 사옥에서 보냄"이 붙습니다.</p>
  </div>
</div>

<!-- 비밀번호 칸 (개발 26, 보안 02 규격). 비밀번호는 이 브라우저 메모리에서만 쓰고 저장하지 않는다. -->
<div class="gate" id="gate">
  <form class="gate-card" id="gateForm" method="post" action="#">
    <h2>다정다감컴퍼니 사옥</h2>
    <p>들어가면 알림 소리가 납니다</p>
    <input type="password" id="gatePw" class="gate-pw" autocomplete="current-password" placeholder="비밀번호" aria-label="사옥 비밀번호">
    <button id="enter" type="submit">사무실 들어가기</button>
    <p class="gate-msg" id="gateMsg" role="alert"></p>
  </form>
</div>

<script src="office.js" charset="utf-8"></script>
<script src="lock.js" charset="utf-8"></script>
</body>
</html>
